[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is owned by the formatter; long URL/header string literals in the
# inherited ESB portal client are left intact.
ignore = ["E501"]
