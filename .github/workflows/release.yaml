name: Release

# Push an annotated tag (git tag -a vX.Y.Z) and this publishes the GitHub
# release HACS installs from. The tag's subject line becomes the release
# title and its body becomes the release notes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout fetches the tag as a bare ref; re-fetch to get the
      # annotation (title + notes).
      - name: Fetch annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check manifest version matches tag
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/esb_smart_meter/manifest.json'))['version'])")
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest}"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${title:-$GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
