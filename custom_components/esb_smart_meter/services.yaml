reload:
  name: Reload ESB smart meter data
  description: Re-scan the configured ESB CSV folder and update all ESB Smart Meter sensors.

download_latest:
  name: Download from ESB Networks
  description: >-
    Log in to the ESB Networks portal and download the latest interval CSV into
    the configured import folder, then refresh sensors. Requires username,
    password and MPRN to be configured. ESB rate-limits logins, so call this at
    most once or twice per day.

import_statistics:
  name: Import history into statistics
  description: >-
    Backfill available CSV history into Home Assistant long-term statistics so
    past usage and cost appear on the Energy dashboard. This also runs
    automatically after each refresh, so calling it by hand is rarely needed.
    Safe to run again; existing points are updated in place.
  fields:
    rebuild:
      name: Rebuild from scratch
      description: >-
        Rewrite the whole series from a zero total instead of continuing from
        the newest point already recorded. Only use this to repair a corrupted
        series - if old readings have since been pruned, the rebuilt totals
        will not line up with history the recorder still holds.
      default: false
      selector:
        boolean:

prune:
  name: Prune old readings
  description: >-
    Consolidate the import folder into a single tidy CSV, keeping only the most
    recent days. Original files are moved to a 'pruned_backup' subfolder (never
    hard-deleted). The lifetime Total import sensor is unaffected.
  fields:
    keep_days:
      name: Keep days
      description: Number of most-recent days of readings to keep.
      default: 90
      selector:
        number:
          min: 1
          max: 1095
          unit_of_measurement: days
          mode: box
